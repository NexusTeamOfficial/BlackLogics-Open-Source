plugins {
	id 'com.android.application'
}

android {
	compileSdk 34
	
	useLibrary 'org.apache.http.legacy'
	
	defaultConfig {
		applicationId "com.nexusteam.blacklogics"
		namespace "com.nexusteam.blacklogics"
		minSdkVersion 21
		targetSdkVersion 36
		versionCode 20965
		versionName "0.1.5"
	}
	
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'com.google.android.gms:play-services-ads:23.4.0'
	implementation 'com.google.code.gson:gson:2.11.0'
	implementation 'de.hdodenhof:circleimageview:3.1.0'
	implementation 'com.airbnb.android:lottie:6.5.2'
	implementation 'com.github.angads25:filepicker:1.1.1'
	implementation 'androidx.customview:customview:1.1.0'
	implementation 'com.squareup.leakcanary:leakcanary-android:2.14'
	implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
	implementation 'com.airbnb.android:epoxy:5.1.3'
	implementation 'org.eclipse.jdt:ecj:3.28.0'
	implementation 'androidx.core:core:1.16.0'
	implementation 'androidx.core:core-splashscreen:1.0.1'
	implementation 'io.github.rosemoe:editor:0.23.7'
	implementation 'io.github.rosemoe:language-java:0.23.7'
	implementation 'com.caverock:androidsvg:1.4'
}
